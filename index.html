<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315c4b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ことばの森"><link rel="icon" href="assets/icon.svg"><title>ことばの森｜動漫日文學習</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f7f4ed;color:#1f2926}.wrap{max-width:900px;margin:auto;padding:22px 16px 90px}header{padding:25px 0}h1{font-size:31px;margin:5px 0}.sub{color:#68746f;line-height:1.7}.card{background:#fffdf8;border:1px solid #ddd7ca;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 8px 30px #315c4b0d}button,.pick{border:0;border-radius:13px;padding:12px 15px;font-weight:750;font-size:15px;cursor:pointer}.primary{background:#315c4b;color:white}.orange{background:#d77746;color:white}.ghost{background:#eee9df;color:#315c4b}.pick{display:inline-block;background:#315c4b;color:white}.pick input{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}input,textarea,select{width:100%;border:1px solid #d8d1c5;border-radius:12px;padding:11px;background:white;font-size:16px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.preview{margin-top:14px;background:#111;border-radius:17px;overflow:hidden}.preview img{width:100%;display:block}.progress{height:8px;background:#e7e0d5;border-radius:10px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;width:0;background:#d77746}.jp{font-size:24px;font-weight:750;line-height:1.6}.kana{color:#315c4b}.zh{line-height:1.7}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#e7efe9;font-size:11px;margin-right:5px}.item img{width:100%;max-height:330px;object-fit:contain;background:#111;border-radius:14px}.actions{display:flex;gap:7px;margin-top:12px}.hidden{display:none}.notice{background:#f8e7df;color:#795044;padding:11px;border-radius:12px;font-size:12px;line-height:1.6;margin-top:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8dd;backdrop-filter:blur(14px);border-top:1px solid #ddd7ca;padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}.nav button{padding:10px 13px}.wordgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.word{background:#fff;border:1px solid #ddd7ca;border-radius:15px;padding:14px}.word b{font-size:24px}.word small{display:block;color:#68746f;margin-top:5px}@media(max-width:600px){h1{font-size:27px}.row>*{flex:1}.card{padding:16px}}</style></head><body><div class="wrap"><header><small>JAPANESE VISUAL LEARNING</small><h1>ことばの森 🌿</h1><div class="sub">用單字、文法與動漫截圖累積自己的日文資料庫。資料會保存在目前這台裝置的瀏覽器。</div></header><section id="home"><div class="card"><h2>📷 動漫截圖自動辨識</h2><p class="sub">從 iPhone 照片選擇截圖，辨識日文字幕後再加入收藏。</p><label class="pick">選擇動漫截圖<input id="img" type="file" accept="image/*"></label><div id="pv" class="preview hidden"><img id="pvi"></div><label>辨識範圍</label><select id="crop"><option value="all">整張</option><option value="middle">中下方</option><option value="bottom" selected>最下方字幕</option></select><button id="ocr" class="orange" style="width:100%;margin-top:12px">開始辨識日文</button><div id="prog" class="hidden"><div class="progress"><i id="bar"></i></div><div id="status" class="sub">準備中</div></div><label>日文原句</label><textarea id="jp" rows="3" placeholder="OCR 結果會出現在這裡，也可以手動修改"></textarea><label>平假名</label><input id="kana" placeholder="請確認後填寫／修改"><label>中文</label><textarea id="zh" rows="2" placeholder="用自己的話寫中文意思"></textarea><div class="row"><div><label>作品中文名</label><input id="anime" placeholder="例如：鬼滅之刃"></div><div><label>作品日文名</label><input id="animeja" placeholder="例如：鬼滅の刃"></div></div><label>觀看網址</label><input id="url" type="url" placeholder="YouTube 或合法觀看網址"><label>文法／語感筆記</label><textarea id="note" rows="3" placeholder="例如：〜ちゃって＝〜てしまって的口語縮約"></textarea><div class="notice">⚠️ OCR 可能把特殊字型、人名或中日字幕辨識錯誤。建議對照原片確認後再背。</div><button id="save" class="primary" style="width:100%;margin-top:14px">加入我的動漫日文</button></div><div class="card"><h2>N5～N1 單字入口</h2><div class="wordgrid" id="words"></div></div></section><section id="library" class="hidden"><div class="card"><div class="row"><h2 style="flex:1">我的動漫日文</h2><button id="export" class="ghost">匯出備份</button></div><input id="search" placeholder="搜尋日文、中文、作品"><div id="list"></div></div></section></div><div class="nav"><button class="primary" onclick="show('home')">學習／新增</button><button class="ghost" onclick="show('library')">我的收藏</button></div><script>const $=s=>document.querySelector(s);let imageData='';const samples=[['N5','朝','あさ','早上'],['N5','学校','がっこう','學校'],['N4','向かう','むかう','前往、朝向'],['N4','準備','じゅんび','準備'],['N3','整う','ととのう','齊備、準備完成'],['N3','全く','まったく','完全、真是'],['N2','いちいち','いちいち','逐一、每次都'],['N1','赴く','おもむく','前往']];$('#words').innerHTML=samples.map(x=>`<div class="word"><span class="tag">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small><small>${x[3]}</small><button class="ghost" onclick="speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance('${x[1]}'),{lang:'ja-JP'}))">🔊</button></div>`).join('');function entries(){return JSON.parse(localStorage.getItem('kotobaEntries')||'[]')}function setEntries(v){localStorage.setItem('kotobaEntries',JSON.stringify(v))}function show(id){$('#home').classList.toggle('hidden',id!=='home');$('#library').classList.toggle('hidden',id!=='library');if(id==='library')render()}$('#img').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{imageData=r.result;$('#pvi').src=imageData;$('#pv').classList.remove('hidden')};r.readAsDataURL(f)};function cropCanvas(){let img=$('#pvi'),c=document.createElement('canvas'),mode=$('#crop').value,y=0,h=img.naturalHeight;if(mode==='middle'){y=h*.35;h*=.45}else if(mode==='bottom'){y=h*.58;h*=.4}let scale=Math.min(2,1600/img.naturalWidth);c.width=img.naturalWidth*scale;c.height=h*scale;c.getContext('2d').drawImage(img,0,y,img.naturalWidth,h,0,0,c.width,c.height);return c}$('#ocr').onclick=async()=>{if(!imageData)return alert('請先選擇截圖');$('#prog').classList.remove('hidden');let worker;try{worker=await Tesseract.createWorker('jpn',1,{logger:m=>{if(typeof m.progress==='number'){$('#bar').style.width=Math.round(m.progress*100)+'%';$('#status').textContent=(m.status||'辨識中')+' '+Math.round(m.progress*100)+'%'}}});let r=await worker.recognize(cropCanvas());$('#jp').value=(r.data.text||'').replace(/[ |｜]/g,'').trim();$('#status').textContent='完成，請確認辨識結果';}catch(e){alert('辨識失敗，請確認網路或改選更清楚的截圖')}finally{if(worker)worker.terminate()}};$('#save').onclick=()=>{if(!$('#jp').value.trim())return alert('請先輸入或辨識日文');let a=entries();a.unshift({id:Date.now(),jp:$('#jp').value.trim(),kana:$('#kana').value.trim(),zh:$('#zh').value.trim(),anime:$('#anime').value.trim(),animeja:$('#animeja').value.trim(),url:$('#url').value.trim(),note:$('#note').value.trim(),image:imageData,verified:false});try{setEntries(a);alert('已加入收藏');['jp','kana','zh','anime','animeja','url','note'].forEach(id=>$('#'+id).value='')}catch(e){alert('儲存空間不足，建議使用較小截圖或先匯出備份')}};function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let q=$('#search').value.toLowerCase();let a=entries().filter(x=>[x.jp,x.kana,x.zh,x.anime,x.animeja].join(' ').toLowerCase().includes(q));$('#list').innerHTML=a.length?a.map(x=>`<div class="card item">${x.image?`<img src="${x.image}">`:''}<div style="margin-top:12px"><span class="tag">待確認</span>${x.anime?`<span class="tag">${esc(x.anime)}</span>`:''}</div><div class="jp">${esc(x.jp)}</div><div class="kana">${esc(x.kana)}</div><p class="zh">${esc(x.zh)}</p>${x.note?`<p><b>文法／語感：</b>${esc(x.note)}</p>`:''}<div class="actions"><button class="ghost" onclick="speak('${encodeURIComponent(x.jp)}')">🔊 朗讀</button>${x.url?`<button class="ghost" onclick="window.open('${esc(x.url)}','_blank')">▶ 原片</button>`:''}<button class="ghost" onclick="del(${x.id})">刪除</button></div></div>`).join(''):'<p class="sub">還沒有收藏。先去加入第一張動漫截圖吧。</p>'}function speak(t){let u=new SpeechSynthesisUtterance(decodeURIComponent(t));u.lang='ja-JP';speechSynthesis.speak(u)}function del(id){if(confirm('確定刪除？')){setEntries(entries().filter(x=>x.id!==id));render()}}$('#search').oninput=render;$('#export').onclick=()=>{let b=new Blob([JSON.stringify(entries(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kotoba-backup.json';a.click()};</script></body></html>
