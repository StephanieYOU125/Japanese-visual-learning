<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315c4b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ことばの森"><link rel="icon" href="assets/icon.svg"><title>ことばの森｜動漫日文學習</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f7f4ed;color:#1f2926}.wrap{max-width:900px;margin:auto;padding:22px 16px 100px}header{padding:22px 0}h1{font-size:30px;margin:5px 0}.sub{color:#68746f;line-height:1.65}.card{background:#fffdf8;border:1px solid #ddd7ca;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 30px #315c4b0d}button,.pick{border:0;border-radius:13px;padding:12px 15px;font-weight:750;font-size:15px;cursor:pointer}.primary{background:#315c4b;color:white}.orange{background:#d77746;color:white}.ghost{background:#eee9df;color:#315c4b}.danger{background:#f7dddd;color:#8b4a4a}.pick{display:inline-block;background:#315c4b;color:white}.pick input{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}input,textarea,select{width:100%;border:1px solid #d8d1c5;border-radius:12px;padding:11px;background:white;font-size:16px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.preview{margin-top:14px;background:#111;border-radius:17px;overflow:hidden}.preview img{width:100%;display:block}.progress{height:8px;background:#e7e0d5;border-radius:10px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;width:0;background:#d77746}.jp{font-size:22px;font-weight:750;line-height:1.65;margin-top:8px}.kana{color:#315c4b;line-height:1.6}.zh{line-height:1.7}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#e7efe9;font-size:11px;margin:2px 4px 2px 0}.lesson-image{width:100%;max-height:420px;object-fit:contain;background:#111;border-radius:16px;margin-bottom:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}.notice{background:#f8e7df;color:#795044;padding:11px;border-radius:12px;font-size:12px;line-height:1.6;margin-top:12px}.success{background:#e5f0e8;color:#376249}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8e8;backdrop-filter:blur(14px);border-top:1px solid #ddd7ca;padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:7px;z-index:9}.nav button{padding:10px 12px}.wordgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.word{background:#fff;border:1px solid #ddd7ca;border-radius:15px;padding:14px}.word b{font-size:24px}.word small{display:block;color:#68746f;margin-top:5px}.scene{border-left:4px solid #315c4b}.details{background:#f4f1e9;border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.65}.details ul{padding-left:20px;margin:7px 0}.count{font-size:13px;color:#68746f;margin:8px 0}.image-note{font-size:12px;color:#68746f;margin:5px 0 0}@media(max-width:600px){h1{font-size:27px}.row>*{flex:1}.card{padding:16px}.nav button{font-size:13px;padding:9px}.lesson-image{max-height:330px}}</style></head><body><div class="wrap"><header><small>JAPANESE VISUAL LEARNING</small><h1>ことばの森 🌿</h1><div class="sub">動漫場景、圖片、單字與文法，集中在一個 iPhone 日文學習資料庫。</div></header><section id="home"><div class="card"><h2>📷 動漫截圖自動辨識</h2><p class="sub">從 iPhone 照片選擇截圖，OCR 日文字幕後可修正並收藏。</p><label class="pick">選擇動漫截圖<input id="img" type="file" accept="image/*"></label><div id="pv" class="preview hidden"><img id="pvi"></div><label>辨識範圍</label><select id="crop"><option value="all">整張</option><option value="middle">中下方</option><option value="bottom" selected>最下方字幕</option></select><button id="ocr" class="orange" style="width:100%;margin-top:12px">開始辨識日文</button><div id="prog" class="hidden"><div class="progress"><i id="bar"></i></div><div id="status" class="sub">準備中</div></div><label>日文原句</label><textarea id="jp" rows="3" placeholder="OCR 結果會出現在這裡，也可以手動修改"></textarea><label>平假名</label><input id="kana" placeholder="請確認後填寫／修改"><label>中文</label><textarea id="zh" rows="2" placeholder="用自己的話寫中文意思"></textarea><div class="row"><div><label>作品中文名</label><input id="anime" placeholder="例如：鬼滅之刃"></div><div><label>作品日文名</label><input id="animeja" placeholder="例如：鬼滅の刃"></div></div><label>文法／語感筆記</label><textarea id="note" rows="3"></textarea><div class="notice">OCR 可能把特殊字型、人名或中日字幕辨識錯誤，請對照原片確認。</div><button id="save" class="primary" style="width:100%;margin-top:14px">加入我的動漫日文</button></div><div class="card"><h2>N5～N1 單字入口</h2><div class="wordgrid" id="words"></div></div></section><section id="database" class="hidden"><div class="card"><h2>🎬 內建動漫資料庫</h2><p class="sub">每句教材都可以加入對應截圖。圖片會保存在目前裝置，並與該句教材綁定。</p><div class="notice success">操作方式：找到句子 → 按「加入／更換圖片」→ 從照片選擇相對應的截圖。</div><input id="dbsearch" placeholder="搜尋日文、中文、單字、文法"><div id="dbcount" class="count"></div><div id="dblist"></div></div></section><section id="library" class="hidden"><div class="card"><div class="row"><h2 style="flex:1">我的收藏</h2><button id="export" class="ghost">匯出備份</button></div><p class="sub">這裡是你自行新增的截圖與筆記。</p><input id="search" placeholder="搜尋日文、中文、作品"><div id="list"></div></div></section></div><input id="dbImagePicker" type="file" accept="image/*" class="hidden"><div class="nav"><button class="primary" onclick="show('home')">學習／新增</button><button class="ghost" onclick="show('database')">動漫資料庫</button><button class="ghost" onclick="show('library')">我的收藏</button></div><script>const $=s=>document.querySelector(s);let imageData='',builtIn=[],editingDBImageId='';const samples=[['N5','朝','あさ','早上'],['N5','学校','がっこう','學校'],['N4','向かう','むかう','前往、朝向'],['N4','準備','じゅんび','準備'],['N3','整う','ととのう','齊備、準備完成'],['N3','全く','まったく','完全、真是'],['N2','いちいち','いちいち','逐一、每次都'],['N1','赴く','おもむく','前往']];$('#words').innerHTML=samples.map(x=>`<div class="word"><span class="tag">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small><small>${x[3]}</small><button class="ghost" onclick="speak('${encodeURIComponent(x[1])}')">🔊</button></div>`).join('');function entries(){try{return JSON.parse(localStorage.getItem('kotobaEntries')||'[]')}catch(e){return[]}}function setEntries(v){localStorage.setItem('kotobaEntries',JSON.stringify(v))}function dbImages(){try{return JSON.parse(localStorage.getItem('kotobaDBImages')||'{}')}catch(e){return{}}}function setDBImages(v){localStorage.setItem('kotobaDBImages',JSON.stringify(v))}function show(id){['home','database','library'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));if(id==='database')renderDB();if(id==='library')render()}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function loadDB(){try{let r=await fetch('data/anime-entries-2026-08-07.json',{cache:'no-store'});if(!r.ok)throw Error();builtIn=await r.json()}catch(e){builtIn=[]}}loadDB();function compressImage(file,maxWidth=1100,quality=.72){return new Promise((resolve,reject)=>{let reader=new FileReader,im=new Image;reader.onerror=reject;reader.onload=()=>im.src=reader.result;im.onerror=reject;im.onload=()=>{let scale=Math.min(1,maxWidth/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};reader.readAsDataURL(file)})}$('#img').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{imageData=r.result;$('#pvi').src=imageData;$('#pv').classList.remove('hidden')};r.readAsDataURL(f)};function cropCanvas(){let img=$('#pvi'),c=document.createElement('canvas'),mode=$('#crop').value,y=0,h=img.naturalHeight;if(mode==='middle'){y=h*.35;h*=.45}else if(mode==='bottom'){y=h*.58;h*=.4}let scale=Math.min(2,1600/img.naturalWidth);c.width=img.naturalWidth*scale;c.height=h*scale;c.getContext('2d').drawImage(img,0,y,img.naturalWidth,h,0,0,c.width,c.height);return c}$('#ocr').onclick=async()=>{if(!imageData)return alert('請先選擇截圖');$('#prog').classList.remove('hidden');let worker;try{worker=await Tesseract.createWorker('jpn',1,{logger:m=>{if(typeof m.progress==='number'){$('#bar').style.width=Math.round(m.progress*100)+'%';$('#status').textContent=(m.status||'辨識中')+' '+Math.round(m.progress*100)+'%'}}});let r=await worker.recognize(cropCanvas());$('#jp').value=(r.data.text||'').replace(/[ |｜]/g,'').trim();$('#status').textContent='完成，請確認辨識結果'}catch(e){alert('辨識失敗，請確認網路或改選更清楚的截圖')}finally{if(worker)worker.terminate()}};$('#save').onclick=async()=>{if(!$('#jp').value.trim())return alert('請先輸入或辨識日文');let a=entries(),savedImage=imageData;if(imageData.startsWith('data:')){try{let b=await fetch(imageData),f=new File([await b.blob()],'image.jpg',{type:'image/jpeg'});savedImage=await compressImage(f)}catch(e){}}a.unshift({id:Date.now(),jp:$('#jp').value.trim(),kana:$('#kana').value.trim(),zh:$('#zh').value.trim(),anime:$('#anime').value.trim(),animeja:$('#animeja').value.trim(),note:$('#note').value.trim(),image:savedImage});try{setEntries(a);alert('已加入我的收藏');['jp','kana','zh','anime','animeja','note'].forEach(id=>$('#'+id).value='');imageData='';$('#pv').classList.add('hidden')}catch(e){alert('儲存空間不足，請先匯出備份或使用較小截圖')}};function chooseDBImage(id){editingDBImageId=id;$('#dbImagePicker').value='';$('#dbImagePicker').click()}$('#dbImagePicker').onchange=async e=>{let f=e.target.files[0];if(!f||!editingDBImageId)return;try{let data=await compressImage(f),map=dbImages();map[editingDBImageId]=data;setDBImages(map);renderDB();alert('圖片已加入這句動漫日文')}catch(err){alert('圖片處理失敗，請改用另一張圖片')}};function removeDBImage(id){if(!confirm('要移除這句教材的圖片嗎？'))return;let map=dbImages();delete map[id];setDBImages(map);renderDB()}function renderDB(){let q=$('#dbsearch').value.toLowerCase(),map=dbImages(),a=builtIn.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('#dbcount').textContent=`共 ${a.length} 句教材，其中 ${a.filter(x=>x.image||map[x.id]).length} 句已有圖片`;$('#dblist').innerHTML=a.length?a.map(x=>{let img=x.image||map[x.id]||'';return `<div class="card scene">${img?`<img class="lesson-image" src="${img}" alt="${esc(x.jp)}">`:''}<div><span class="tag">${esc(x.level||'動漫日文')}</span><span class="tag">${esc(x.scene||'場景')}</span>${img?'<span class="tag">已有圖片</span>':'<span class="tag">尚無圖片</span>'}</div><div class="jp">${esc(x.jp)}</div><div class="kana">${esc(x.kana)}</div><p class="zh">${esc(x.zh)}</p>${x.words?.length?`<div class="details"><b>🔤 單字拆解</b><ul>${x.words.map(w=>`<li><b>${esc(w.word)}</b>（${esc(w.kana)}）＝ ${esc(w.zh)}</li>`).join('')}</ul></div>`:''}${x.grammar?.length?`<div class="details"><b>🧠 文法／語感</b><ul>${x.grammar.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>`:''}${x.note?`<div class="notice">${esc(x.note)}</div>`:''}<div class="actions"><button class="ghost" onclick="speak('${encodeURIComponent(x.jp)}')">🔊 朗讀</button><button class="primary" onclick="chooseDBImage('${x.id}')">📷 ${img?'更換圖片':'加入圖片'}</button>${img?`<button class="danger" onclick="removeDBImage('${x.id}')">移除圖片</button>`:''}</div><p class="image-note">圖片目前保存在這台裝置；GitHub 內建教材文字仍會跨裝置顯示。</p></div>`}).join(''):'<p class="sub">找不到符合的教材。</p>'}function render(){let q=$('#search').value.toLowerCase(),a=entries().filter(x=>[x.jp,x.kana,x.zh,x.anime,x.animeja].join(' ').toLowerCase().includes(q));$('#list').innerHTML=a.length?a.map(x=>`<div class="card">${x.image?`<img class="lesson-image" src="${x.image}">`:''}<div>${x.anime?`<span class="tag">${esc(x.anime)}</span>`:''}</div><div class="jp">${esc(x.jp)}</div><div class="kana">${esc(x.kana)}</div><p class="zh">${esc(x.zh)}</p>${x.note?`<div class="details"><b>文法／語感</b><br>${esc(x.note)}</div>`:''}<div class="actions"><button class="ghost" onclick="speak('${encodeURIComponent(x.jp)}')">🔊 朗讀</button><button class="danger" onclick="del(${x.id})">刪除</button></div></div>`).join(''):'<p class="sub">還沒有裝置收藏。你可以從「學習／新增」加入截圖。</p>'}function speak(t){let u=new SpeechSynthesisUtterance(decodeURIComponent(t));u.lang='ja-JP';speechSynthesis.speak(u)}function del(id){if(confirm('確定刪除？')){setEntries(entries().filter(x=>x.id!==id));render()}}$('#search').oninput=render;$('#dbsearch').oninput=renderDB;$('#export').onclick=()=>{let payload={localEntries:entries(),builtInImages:dbImages(),exportedAt:new Date().toISOString()},b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kotoba-backup.json';a.click()};</script></body></html>
